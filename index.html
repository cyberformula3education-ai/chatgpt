<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Математический канат</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f172a;
      --panel: #1e293b;
      --accent: #38bdf8;
      --p1: #22c55e;
      --p2: #f97316;
      --text: #e2e8f0;
      --muted: #94a3b8;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(circle at top, #1e293b, var(--bg));
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .game {
      width: min(900px, 100%);
      background: color-mix(in srgb, var(--panel) 85%, black);
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 16px 30px rgb(0 0 0 / 25%);
    }

    h1 {
      margin-top: 0;
      margin-bottom: 8px;
      text-align: center;
      font-size: clamp(1.6rem, 3vw, 2.3rem);
    }

    .hint {
      margin: 0 0 24px;
      text-align: center;
      color: var(--muted);
    }

    .scoreboard {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 12px;
      align-items: center;
      margin-bottom: 20px;
    }

    .player-card {
      background: #0b1222;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 12px;
      text-align: center;
    }

    .player-card h2 {
      margin: 0 0 8px;
      font-size: 1rem;
      font-weight: 700;
    }

    .player-card .score {
      font-size: 1.8rem;
      font-weight: 800;
    }

    .current-turn {
      font-weight: 700;
      color: var(--accent);
      text-align: center;
      min-width: 140px;
    }

    .rope-wrap {
      margin: 20px 0 24px;
      position: relative;
      padding: 12px 0;
    }

    .rope {
      height: 10px;
      border-radius: 999px;
      background: linear-gradient(to right, var(--p1), #f8fafc, var(--p2));
      position: relative;
      overflow: hidden;
    }

    .center-mark {
      position: absolute;
      inset: -8px auto -8px 50%;
      width: 3px;
      background: #f8fafc;
      transform: translateX(-50%);
      opacity: 0.4;
    }

    .flag {
      position: absolute;
      top: -7px;
      width: 18px;
      height: 24px;
      border-radius: 2px;
      background: var(--accent);
      box-shadow: 0 0 0 2px rgb(15 23 42 / 40%);
      left: 50%;
      transform: translateX(-50%);
      transition: left 300ms ease;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      margin-bottom: 10px;
    }

    input, button {
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px;
      font-size: 1rem;
      color: var(--text);
      background: #0b1222;
    }

    button {
      cursor: pointer;
      font-weight: 700;
      background: #0369a1;
      border-color: #0ea5e9;
    }

    button:hover { filter: brightness(1.08); }
    .question {
      font-size: 1.2rem;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .message { min-height: 1.4rem; color: var(--muted); }
    .winner {
      margin-top: 14px;
      font-size: 1.1rem;
      font-weight: 800;
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="game">
    <h1>Перетягивание каната: Математика</h1>
    <p class="hint">Отвечайте по очереди. За каждый правильный ответ +1 балл, и канат смещается в вашу сторону.</p>

    <section class="scoreboard">
      <article class="player-card">
        <h2>Игрок 1</h2>
        <div id="score1" class="score">0</div>
      </article>
      <div id="turn" class="current-turn">Ход: Игрок 1</div>
      <article class="player-card">
        <h2>Игрок 2</h2>
        <div id="score2" class="score">0</div>
      </article>
    </section>

    <section class="rope-wrap" aria-label="Канат">
      <div class="rope"></div>
      <div class="center-mark"></div>
      <div id="flag" class="flag"></div>
    </section>

    <div id="question" class="question"></div>
    <div class="controls">
      <input id="answer" type="number" placeholder="Ваш ответ" />
      <button id="submit">Ответить</button>
    </div>
    <div id="message" class="message"></div>
    <div id="winner" class="winner"></div>
  </main>

  <script>
    const scoreEls = [document.getElementById('score1'), document.getElementById('score2')];
    const turnEl = document.getElementById('turn');
    const questionEl = document.getElementById('question');
    const answerEl = document.getElementById('answer');
    const messageEl = document.getElementById('message');
    const winnerEl = document.getElementById('winner');
    const flagEl = document.getElementById('flag');
    const submitBtn = document.getElementById('submit');

    const state = {
      scores: [0, 0],
      active: 0,
      current: null,
      winDelta: 5,
    };

    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function newQuestion() {
      const a = randomInt(1, 20);
      const b = randomInt(1, 20);
      const op = Math.random() < 0.5 ? '+' : '-';
      const answer = op === '+' ? a + b : a - b;
      state.current = { text: `${a} ${op} ${b} = ?`, answer };
      questionEl.textContent = `Вопрос для Игрока ${state.active + 1}: ${state.current.text}`;
      answerEl.value = '';
      answerEl.focus();
    }

    function updateRope() {
      const diff = state.scores[0] - state.scores[1];
      const shift = Math.max(-45, Math.min(45, diff * 9));
      flagEl.style.left = `${50 + shift}%`;
    }

    function updateUI() {
      scoreEls[0].textContent = state.scores[0];
      scoreEls[1].textContent = state.scores[1];
      turnEl.textContent = `Ход: Игрок ${state.active + 1}`;
      updateRope();
    }

    function checkWinner() {
      const diff = state.scores[0] - state.scores[1];
      if (Math.abs(diff) >= state.winDelta) {
        const winner = diff > 0 ? 1 : 2;
        winnerEl.textContent = `🏆 Игрок ${winner} перетянул канат и победил!`;
        submitBtn.disabled = true;
        answerEl.disabled = true;
        messageEl.textContent = 'Игра окончена.';
        return true;
      }
      return false;
    }

    function submitAnswer() {
      if (!state.current) return;

      const value = Number(answerEl.value);
      if (!Number.isFinite(value)) {
        messageEl.textContent = 'Введите число.';
        return;
      }

      if (value === state.current.answer) {
        state.scores[state.active] += 1;
        messageEl.textContent = 'Верно! +1 балл.';
      } else {
        messageEl.textContent = `Неверно. Правильный ответ: ${state.current.answer}.`;
      }

      if (checkWinner()) {
        updateUI();
        return;
      }

      state.active = state.active === 0 ? 1 : 0;
      updateUI();
      newQuestion();
    }

    submitBtn.addEventListener('click', submitAnswer);
    answerEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') submitAnswer();
    });

    updateUI();
    newQuestion();
  </script>
</body>
</html>
